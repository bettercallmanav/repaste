name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    # macOS on purpose, not just to match the dev machine: the desktop build
    # compiles the Vision OCR helper with `xcrun swiftc`, so a Linux runner
    # would silently skip the one step most likely to break. Public repos get
    # macOS runners free.
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Last because it is the slowest and the only macOS-specific step.
      # Turbo builds contracts first via `^build`.
      - name: Build
        run: bun run build
